<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9eae6">
<title>大学新生活共创实验 · 寻访</title>
<style>
:root{--paper:#f1f2ee;--white:#fff;--ink:#22292b;--mid:#566064;--muted:#8a9292;--line:#d5d9d5;--yellow:#e9c83e;--yellow2:#d3ae19;--teal:#718d89;--shadow:0 10px 28px #18202218}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei","Noto Sans SC",sans-serif;background-image:linear-gradient(130deg,#fff9 0 1px,transparent 1px 100%),linear-gradient(25deg,#cfd3ce55 1px,transparent 1px 100%);background-size:42px 42px,76px 76px}button{font:inherit;cursor:pointer}.app{max-width:1120px;margin:auto;padding:0 24px 44px}.topbar{height:51px;background:#202729;color:#fff;display:flex;align-items:center;justify-content:space-between;margin:0 -24px;padding:0 24px;font-size:9px;letter-spacing:.18em}.topbrand{display:flex;align-items:center;gap:10px;font-weight:800}.diamond{width:17px;height:17px;background:var(--yellow);transform:rotate(45deg);position:relative}.diamond:after{content:"";position:absolute;inset:4px;border:1px solid #202729}.sys{color:#a8b0ac}.sys i{display:inline-block;width:6px;height:6px;background:#89c59b;border-radius:50%;margin-right:7px}
.hero{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:center;padding:25px 27px 23px;margin:20px 0 14px;background:#fff;position:relative;overflow:hidden;border:1px solid #dce0dc;box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;inset:0 0 0 auto;width:35%;background:linear-gradient(110deg,transparent 0 34%,#f1f2ee 34% 35%,transparent 35%),repeating-linear-gradient(135deg,#202729 0 2px,transparent 2px 10px);opacity:.09;clip-path:polygon(45% 0,100% 0,100% 100%,0 100%)}.hero-content,.hero-stat{position:relative;z-index:1}.eyebrow{font-size:9px;letter-spacing:.22em;font-weight:900;color:#7f8988}.hero h1{margin:8px 0 5px;font-size:clamp(28px,4.4vw,43px);letter-spacing:.06em;font-weight:900}.hero p{margin:0;color:#697375;font-size:12px}.hero .slogan{display:flex;align-items:center;gap:8px;margin-top:14px;color:#596365;font-size:10px;letter-spacing:.07em}.hero .slogan:before{content:"";width:20px;height:3px;background:var(--yellow)}.hero-stat{text-align:right;border-left:1px solid #d7dcd8;padding-left:18px}.hero-stat strong{display:block;font-size:28px;letter-spacing:.05em}.hero-stat span{color:#818b89;font-size:8px;letter-spacing:.18em}.yellow-line{height:4px;width:54px;margin:8px 0 0 auto;background:var(--yellow)}
.recruit-panel{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:center;background:#292f31;color:#edf0ec;padding:17px 21px;margin-bottom:17px;box-shadow:var(--shadow)}.panel-label{font-size:9px;color:#c7cfc9;letter-spacing:.18em;font-weight:800}.progress{display:flex;align-items:baseline;gap:9px;margin-top:5px}.progress strong{font-size:24px;color:var(--yellow);font-weight:900}.progress span{font-size:10px;color:#c4cac5}.meter{height:4px;max-width:340px;margin-top:9px;background:#535b5b}.meter i{display:block;height:100%;width:0;background:var(--yellow);transition:width .4s}.rules{margin-top:7px;color:#9da7a2;font-size:9px;letter-spacing:.04em}.recruit-actions{text-align:right}.single{min-width:190px;border:0;background:var(--yellow);color:#202729;padding:12px 17px;font-size:11px;font-weight:900;letter-spacing:.11em;box-shadow:0 3px 0 #b39721;transition:.18s}.single:hover{background:#f2d960;transform:translateY(-1px)}.single:disabled{opacity:.55;cursor:wait;transform:none}.action-note{margin-top:8px;color:#aab2ad;font-size:8px;letter-spacing:.13em}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.unit-card{min-height:334px;background:#fff;border:1px solid #cfd5d1;position:relative;overflow:hidden;box-shadow:0 7px 20px #1c242412;transition:transform .2s,box-shadow .2s}.unit-card:not(.empty):hover{transform:translateY(-3px);box-shadow:0 13px 25px #1c242422}.art{height:122px;position:relative;overflow:hidden;background:linear-gradient(145deg,#303a3d,#121719);border-bottom:4px solid var(--yellow)}.art:before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,transparent 0 43%,#e8c83d 43% 44%,transparent 44%),repeating-linear-gradient(135deg,#ffffff0b 0 1px,transparent 1px 9px)}.art:after{content:"";position:absolute;width:125px;height:125px;right:-13px;top:13px;border:1px solid #ffffff50;transform:rotate(45deg);box-shadow:0 0 0 13px #ffffff09,0 0 0 28px #ffffff06}.art-symbol{position:absolute;z-index:1;left:50%;top:48%;transform:translate(-50%,-50%);color:#f0d557;font-size:47px;font-weight:300;text-shadow:0 0 22px #e9c83e55}.art-code{position:absolute;z-index:2;left:12px;top:11px;color:#bbc4bd;font-size:8px;letter-spacing:.18em}.art-type{position:absolute;z-index:2;right:11px;bottom:10px;color:#e1e5df;font-size:7px;letter-spacing:.18em}.empty{background:#f7f8f4}.empty .art-symbol{color:#b0b8b4;text-shadow:none}.empty .art{filter:saturate(.55);opacity:.85}.cardbody{padding:12px 13px 13px}.card-meta{display:flex;align-items:center;justify-content:space-between;color:#89928e;font-size:8px;letter-spacing:.13em}.rarity{color:#c2a51c;letter-spacing:.18em}.card-title{font-size:15px;font-weight:900;line-height:1.35;margin:6px 0 9px;color:#293133;min-height:40px}.core-label{border-top:1px solid #e2e5e1;padding-top:8px;font-size:8px;letter-spacing:.18em;color:#8a9390;font-weight:900}.core{font-size:10px;line-height:1.65;color:#4e595a;margin:5px 0 9px;min-height:66px}.reward{padding:7px 8px;background:#f0f1ed;border-left:3px solid var(--yellow2);font-size:9px;line-height:1.45;color:#3e494a}.reward b{color:#7c8581}.card-foot{margin-top:8px;color:#9aa29e;font-size:7px;letter-spacing:.12em;display:flex;justify-content:space-between}.slot-mark{position:absolute;z-index:3;right:10px;top:10px;color:#fff;background:#202729b8;padding:4px 6px;font-size:7px;letter-spacing:.15em}.empty .cardbody{text-align:center}.empty-title{font-size:9px;color:#89938f;letter-spacing:.18em;margin:7px 0}.empty .art{height:182px}.empty .art-symbol{font-size:56px}.empty .cardbody{padding:11px}.empty .slot-mark{background:#252c2dbb}.empty .core{min-height:0}.deploy{animation:reveal .42s cubic-bezier(.16,.84,.3,1.12)}@keyframes reveal{from{opacity:.15;transform:translateY(8px) scale(.96);filter:brightness(1.7)}to{opacity:1;transform:none;filter:none}}.hint{text-align:center;margin:14px 0 0;color:#828c89;font-size:9px;letter-spacing:.07em}.hint b{color:#786918}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#252d2e;color:#f2d65c;border-left:3px solid var(--yellow);padding:10px 15px;font-size:9px;letter-spacing:.12em;box-shadow:0 8px 22px #0003;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.unit-card{min-height:320px}.hero{grid-template-columns:1fr 150px}.recruit-panel{grid-template-columns:1fr 190px}}@media(max-width:560px){.app{padding:0 14px 35px}.topbar{margin:0 -14px;padding:0 14px}.sys{font-size:7px}.hero{grid-template-columns:1fr;padding:19px}.hero-stat{display:none}.recruit-panel{grid-template-columns:1fr;padding:15px;gap:13px}.recruit-actions{text-align:left}.single{width:100%}.cards{gap:9px}.unit-card{min-height:323px}.art{height:105px}.empty .art{height:155px}.cardbody{padding:10px}.card-title{font-size:13px}.core{font-size:9px;min-height:76px}}@media(max-width:390px){.cards{grid-template-columns:1fr}.unit-card{min-height:0}.art{height:145px}.empty .art{height:170px}.core{min-height:0;font-size:10px}.card-title{min-height:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main class="app">
<header class="topbar"><div class="topbrand"><span class="diamond"></span> PERSONNEL RECRUITMENT　/　寻访招募</div><div class="sys">SYSTEM READY　·　12 TASKS AVAILABLE</div></header>
<section class="hero"><div class="hero-content"><div class="eyebrow">CAMPUS OPERATION　 /　 STARTER CARD FILE</div><h1>大学新生活共创实验</h1><p>每次寻访获得一张启动卡，四位成员各领一项行动任务。</p><div class="slogan">大学新生活，玩点新的，让有趣发生</div></div><div class="hero-stat"><strong>12</strong><span>AVAILABLE TASKS</span><div class="yellow-line"></div></div></section>
<section class="recruit-panel"><div><div class="panel-label">本组寻访进度　 /　 DEPLOYMENT STATUS</div><div class="progress"><strong id="count">00</strong><span>/ 04　已寻访</span></div><div class="meter"><i id="meter"></i></div><div class="rules">四次抽取互不重复　·　抽满后为下一组重新洗牌</div></div><div class="recruit-actions"><button class="single" id="draw" type="button">寻访一次　▶</button><div class="action-note" id="actionNote">SINGLE RECRUITMENT / 1 CARD</div></div></section>
<section class="cards" id="cards" aria-live="polite"></section><div class="hint" id="hint">每人寻访一次　·　<strong>同组不重复</strong>　·　抽出的卡面展示任务核心与成果</div>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const tasks=[
{id:'01',name:'好友推荐局',core:'借助队友已有的真实关系，组织一次轻量活动，自然扩大校园朋友圈。',result:'朋友圈扩展图',symbol:'⌘'},
{id:'02',name:'隐藏技能交换局',core:'每人教一次小技能、学一次队友技能，并完成一个技能合成作品。',result:'技能图鉴与合成作品',symbol:'✦'},
{id:'03',name:'队友安利实测局',core:'交换大学生活推荐，真实体验后形成自己的判断。',result:'队友实测安利榜',symbol:'◈'},
{id:'04',name:'课表之外的一周',core:'记录课表外时间，测试一种新的生活节奏。',result:'时间前后对比图',symbol:'◷'},
{id:'05',name:'大学不是全都要',core:'面对一次真实冲突，核实信息、说明标准并作出取舍。',result:'选择说明书',symbol:'△'},
{id:'06',name:'学习方法擂台',core:'用同一学习任务测试不同方法，找到适合自己的方式。',result:'学习方法实测战报',symbol:'▤'},
{id:'07',name:'校园隐藏地图',core:'实测适合学习、讨论或放松的地点，制作新生地图。',result:'校园隐藏地图',symbol:'⌖'},
{id:'08',name:'新生省心工具箱',core:'从真实麻烦出发，制作并测试一个清单、模板或流程工具。',result:'工具1.0与更新说明',symbol:'▣'},
{id:'09',name:'第一次闯关陪跑',core:'陪一位新生完成一件一直不敢或不会开始的大学第一次。',result:'第一次闯关回放',symbol:'➤'},
{id:'10',name:'一平方米快乐改造',core:'用低成本方式改善一处真实小空间，并测试使用效果。',result:'改造前后对比',symbol:'◫'},
{id:'11',name:'AI到底帮上忙了吗',core:'让AI提出建议，再经过核实、现场测试和人工修改。',result:'AI建议真实测评',symbol:'AI'},
{id:'12',name:'校园快乐20分钟',core:'设计一场低门槛校园微活动，邀请至少5名组外同学参与。',result:'活动包与传播内容',symbol:'✛'}];
const host=document.querySelector('#cards');let deck=shuffle(tasks),picked=[],busy=false,toastTimer;
function shuffle(src){const a=[...src];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function blank(i){return `<article class="unit-card empty"><div class="art"><span class="slot-mark">0${i+1}　/　LOCKED</span><span class="art-code">OPERATOR FILE　·　SEALED</span><span class="art-symbol">◇</span><span class="art-type">NEW LIFE PROJECT</span></div><div class="cardbody"><div class="empty-title">等待寻访结果</div><div class="core">启动卡将在抽取后显示于此</div></div></article>`}
function face(t){return `<article class="unit-card deploy"><div class="art"><span class="slot-mark">TASK　${t.id}</span><span class="art-code">PERSONNEL FILE　/　STARTER</span><span class="art-symbol">${t.symbol}</span><span class="art-type">FIELD ASSIGNMENT</span></div><div class="cardbody"><div class="card-meta"><span>启动卡　/　${t.id}</span><span class="rarity">◆ ◆ ◆</span></div><div class="card-title">${t.name}</div><div class="core-label">任务核心　/　OBJECTIVE</div><div class="core">${t.core}</div><div class="reward"><b>最后呈现：</b>${t.result}</div><div class="card-foot"><span>真实行动 · 反馈 · 修改 · 成果</span><span>DEPLOYED</span></div></div></article>`}
function render(){host.innerHTML=Array.from({length:4},(_,i)=>picked[i]?face(picked[i]):blank(i)).join('');document.querySelector('#count').textContent=String(picked.length).padStart(2,'0');document.querySelector('#meter').style.width=`${picked.length*25}%`;const btn=document.querySelector('#draw'),note=document.querySelector('#actionNote'),hint=document.querySelector('#hint');if(picked.length===4){btn.textContent='下一组重新寻访　↻';note.textContent='RESET RECRUITMENT / 12 TASKS';btn.disabled=busy;hint.innerHTML='本组寻访完成　·　<strong>四张卡均不重复</strong>　·　点击上方按钮为下一组重新洗牌'}else{btn.textContent=busy?'正在寻访　◌':'寻访一次　▶';note.textContent=`SINGLE RECRUITMENT / ${deck.length} TASKS LEFT`;btn.disabled=busy;hint.innerHTML='每人寻访一次　·　<strong>同组不重复</strong>　·　抽出的卡面展示任务核心与成果'}}
function draw(){if(busy)return;if(picked.length===4){deck=shuffle(tasks);picked=[];render();notify('下一组已就绪　·　寻访卡池重新洗牌');return}busy=true;render();let tick=0;const timer=setInterval(()=>{if(++tick>=8){clearInterval(timer);picked.push(deck.pop());busy=false;render();document.querySelectorAll('.deploy')[picked.length-1]?.scrollIntoView({behavior:'smooth',block:'center'});notify(`寻访完成　·　${picked.at(-1).name}`)}},105)}
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
document.querySelector('#draw').addEventListener('click',draw);render();
</script></body></html>
